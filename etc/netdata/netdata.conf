# Netdata (Monitoring) – KI-Server, P7
# Nur lokal erreichbar; von außen über Caddy unter https://192.168.10.129/netdata/ (mit Passwort).
# Effektive Gesamtkonfiguration: curl -s http://127.0.0.1:19999/netdata.conf

[web]
	bind to = 127.0.0.1
	allow connections from = localhost
	allow dashboard from = localhost
	allow mcp from = localhost
	allow badges from = localhost
	allow streaming from = localhost

[registry]
	# Eigene Registry statt registry.my-netdata.io (sonst meldet der Browser sich dort)
	enabled = yes
	registry to announce = https://192.168.10.129/netdata
